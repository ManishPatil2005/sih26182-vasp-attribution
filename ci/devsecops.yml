name: CRIMEGRAPH AI DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-quality:
    name: Security Scan & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dev & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install bandit flake8 pytest pytest-cov

      - name: Run Bandit SAST (Security Audit)
        run: |
          if [ -d backend/app ]; then bandit -r backend/app -ll; fi

      - name: Run Pytest Test Suite
        run: |
          if [ -d backend/tests ]; then PYTHONPATH=backend pytest backend/tests; fi
